<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Zöld 2050: dombok, fák, szélkerekek, napelemes ház és egy gyalogút lábnyomokkal">
<style>
.k{stroke:#000;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lap{transform-origin:0 0;animation:forog 9s linear infinite}
.lap2{animation-duration:12s}.lap3{animation-duration:7s}
.felho{animation:usz 26s ease-in-out infinite alternate}
.fa{transform-box:fill-box;transform-origin:50% 100%;animation:ring 5s ease-in-out infinite alternate}
.fa2{animation-delay:-2s}.fa3{animation-delay:-3.5s}
@keyframes forog{to{transform:rotate(360deg)}}
@keyframes usz{to{transform:translateX(36px)}}
@keyframes ring{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.lap,.felho,.fa{animation:none}}
</style>

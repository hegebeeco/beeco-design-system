# beeco BRAND BOOK – Netlify (25. javaslat: két külön oldal). Ez az aktív konfig a beeco-brandbook Netlify-oldalon.
# A Design System külön oldal (beeco-design-system.netlify.app), annak konfigja: netlify.docs-ds.toml.
# Jelszó: BRANDBOOK_JELSZO (+ nem kötelező BRANDBOOK_TITOK) a Netlify környezeti változói között – soha nem a repóban.
# Az oldalak közti linkekhez: DOCS_DS_URL (abszolút cím) és a Netlify-ban beállított környezeti változók.
[build]
  command = "node tools/docs-brand.js"
  publish = "_site/brand"
  # CSAK a Brand Book kapuja: a netlify/edge-functions/brand/ mappa (a régi kapu.js itt NEM fut – lásd kapu-brand.js fejléce)
  edge_functions = "netlify/edge-functions/brand"
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs-site/ tools/docs/ tools/docs-brand.js tokens/ termek/ dist/ web/css/ web/assets/ brandbook/ netlify/edge-functions/ netlify.toml VERSION"

[build.environment]
  NODE_VERSION = "22"

# a kapu útvonalai és szabad (belépő) útvonalai: netlify/edge-functions/brand/kapu-brand.js → config

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'self' https://beeco-szelektalj.netlify.app; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

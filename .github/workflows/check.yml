name: DS-ellenőrzés
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Függőségek
        run: npm ci
      - name: Chromium a komponens-önteszthez
        run: npx playwright install --with-deps chromium
      - name: Tesztek (dist friss, React-kimenet friss, kontraszt, párosság, elemek, komponens-önteszt, játékbőr)
        run: npm test

<svg xmlns="http://www.w3.org/2000/svg" width="280" height="140" viewBox="0 0 280 140"><rect x="1" y="1" width="278" height="138" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="20" y="50" font-family="sans-serif" font-size="22" font-weight="700" fill="#000000">Öntözz velünk!</text><text x="20" y="80" font-family="sans-serif" font-size="7" fill="#505050">Jelentkezés október 12-ig, a részletek és a helyszín a beeco.hu/csapat oldalon,</text><text x="20" y="90" font-family="sans-serif" font-size="7" fill="#505050">kérdés esetén írj nekünk; a részvétel ingyenes, kannát hozz magaddal.</text></svg>
